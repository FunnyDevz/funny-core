name: Tests

on:
  push:
    branches:
      - main
      - pre-main*
  pull_request:

env:
  CRATER_VERSION: v0.7.5

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require DEBUG 0 for main
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: |
          if ! grep -qE '^--#define DEBUG[[:space:]]+0[[:space:]]*$' src/project.gpp; then
            echo "::error::src/project.gpp must contain --#define DEBUG 0 for main"
            exit 1
          fi

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install tools
        run: |
          rokit install --no-trust-check
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crater
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --output "$HOME/.local/bin/crater" "https://github.com/TheExeDEV/crater/releases/download/$CRATER_VERSION/crater-linux-x64"
          chmod +x "$HOME/.local/bin/crater"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.crater/bin" >> "$GITHUB_PATH"

      - name: Run tests
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.RBX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
          CORE_COMMIT: ${{ github.sha }}
        run: python3 CI/test.py --install

      - name: Scrub results
        if: always()
        env:
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        run: |
          [ -d CI/output ] || exit 0
          for value in "$ROBLOX_UNIVERSE_ID" "$ROBLOX_PLACE_ID"; do
            [ -n "$value" ] || continue
            grep -rlF -- "$value" CI/output | xargs -r sed -i "s/$value/***/g"
          done

      - name: Summary
        if: always()
        run: |
          ls CI/output/CI_*.json > /dev/null 2>&1 || exit 0
          python3 CI/report.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-results
          path: CI/output
          if-no-files-found: ignore
