name: Promote

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [pre-main-tests]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

env:
  SOURCE_BRANCH: pre-main-tests
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'pre-main-tests')
    runs-on: ubuntu-latest

    steps:
      - name: Require the token
        env:
          TOKEN: ${{ secrets.CRATER_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CRATER_GITHUB_TOKEN is not set, pull requests opened with GITHUB_TOKEN do not run Tests"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.CRATER_GITHUB_TOKEN }}

      - name: Compare with main
        id: diff
        run: |
          sed -i -E 's/^(--#define DEBUG)[[:space:]]+(true|1)\b/\1 0/' src/project.gpp

          if git diff --quiet origin/main; then
            git checkout -- src/project.gpp
            echo "$SOURCE_BRANCH has nothing new for main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disable DEBUG
        if: steps.diff.outputs.changed == 'true'
        run: |
          if ! git diff --quiet -- src/project.gpp; then
            git commit -m "Disable DEBUG for main" -- src/project.gpp
            git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          fi

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CRATER_GITHUB_TOKEN }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("crater.json"))["version"])')
          released=$(git show origin/main:crater.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')

          if [ "$version" != "$released" ]; then
            title="Release $version"
          else
            title="Merge $SOURCE_BRANCH into main"
          fi

          {
            echo "Automatic pull request from \`$SOURCE_BRANCH\`. \`DEBUG\` is set to \`0\` in \`src/project.gpp\`, after the merge \`$SOURCE_BRANCH\` gets \`DEBUG 1\` back."
            echo
            if [ "$version" != "$released" ]; then
              echo "Bumps the version from $released to $version, after the merge the Release workflow publishes \`v$version\` and opens the crater registry pull request."
              echo
            fi
            echo "Commits:"
            git log --no-merges --format='- %s (%h)' origin/main..HEAD
          } > "$RUNNER_TEMP/body.md"

          pr=$(gh pr list --head "$SOURCE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated #$pr"
          else
            gh pr create --head "$SOURCE_BRANCH" --base main --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Require the token
        env:
          TOKEN: ${{ secrets.CRATER_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CRATER_GITHUB_TOKEN is not set, cannot push to $SOURCE_BRANCH"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.CRATER_GITHUB_TOKEN }}

      - name: Merge main and enable DEBUG
        run: |
          git fetch origin main

          if ! git merge --no-edit origin/main; then
            git merge --abort
            echo "::error::main does not merge into $SOURCE_BRANCH cleanly, merge it by hand and keep DEBUG 1"
            exit 1
          fi

          sed -i -E 's/^(--#define DEBUG)[[:space:]]+(false|0)\b/\1 1/' src/project.gpp
          if ! git diff --quiet -- src/project.gpp; then
            git commit -m "Enable DEBUG for $SOURCE_BRANCH" -- src/project.gpp
          fi

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$SOURCE_BRANCH")" ]; then
            echo "$SOURCE_BRANCH is up to date with main"
            exit 0
          fi

          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
