name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CRATER_VERSION: v0.6.2

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  version:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('crater.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released, bump the version in crater.json to publish again"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install crater
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --output "$HOME/.local/bin/crater" "https://github.com/TheExeDEV/crater/releases/download/$CRATER_VERSION/crater-linux-x64"
          chmod +x "$HOME/.local/bin/crater"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish to crater
        env:
          GH_TOKEN: ${{ secrets.CRATER_TOKEN }}
        run: crater publish -y

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
