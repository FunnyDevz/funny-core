name: Release

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CRATER_VERSION: v0.7.5

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("crater.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, bump the version in crater.json to release again"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.existing.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gpp
        if: steps.existing.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y gpp

      - name: Install crater
        if: steps.existing.outputs.exists == 'false'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --output "$HOME/.local/bin/crater" "https://github.com/TheExeDEV/crater/releases/download/$CRATER_VERSION/crater-linux-x64"
          chmod +x "$HOME/.local/bin/crater"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.crater/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.existing.outputs.exists == 'false'
        run: crater install --locked -y

      - name: Build package and place
        if: steps.existing.outputs.exists == 'false'
        env:
          CORE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p dist
          crater pack -o "dist/funny-core-${{ steps.version.outputs.version }}.zip"
          python3 build/build.py -o "$RUNNER_TEMP/place"
          cp "$RUNNER_TEMP/place/build.rbxl" "dist/funny-core-${{ steps.version.outputs.version }}.rbxl"

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --title "funny-core ${{ steps.version.outputs.version }}" \
            --generate-notes

  registry:
    needs: release
    runs-on: ubuntu-latest
    env:
      REGISTRY: TheExeDEV/crater-registry

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read package
        id: package
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          manifest = json.load(open("crater.json"))
          print(f"name={manifest['name']}")
          print(f"version={manifest['version']}")
          EOF

      - name: Check the registry
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh api "repos/$REGISTRY/contents/$NAME/index.json" --jq .content 2> /dev/null | base64 -d | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' > /dev/null; then
            echo "$NAME@$VERSION is already in the registry"
            echo "state=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr=$(gh pr list -R "$REGISTRY" --state open --search "Publish $NAME@$VERSION in:title" --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            echo "$NAME@$VERSION is waiting in $REGISTRY#$pr"
            echo "state=pending" >> "$GITHUB_OUTPUT"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          else
            echo "state=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the registry token
        if: steps.registry.outputs.state != 'published'
        env:
          CRATER_GITHUB_TOKEN: ${{ secrets.CRATER_GITHUB_TOKEN }}
        run: |
          if [ -z "$CRATER_GITHUB_TOKEN" ]; then
            echo "::error::CRATER_GITHUB_TOKEN is not set, add a classic PAT with public_repo and read:org as a repository secret and rerun this workflow"
            exit 1
          fi

      - name: Setup Python
        if: steps.registry.outputs.state == 'missing'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gpp
        if: steps.registry.outputs.state == 'missing'
        run: sudo apt-get update && sudo apt-get install -y gpp

      - name: Install crater
        if: steps.registry.outputs.state == 'missing'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --output "$HOME/.local/bin/crater" "https://github.com/TheExeDEV/crater/releases/download/$CRATER_VERSION/crater-linux-x64"
          chmod +x "$HOME/.local/bin/crater"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.crater/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.registry.outputs.state == 'missing'
        run: crater install --locked -y

      - name: Publish to the crater registry
        if: steps.registry.outputs.state == 'missing'
        env:
          CRATER_GITHUB_TOKEN: ${{ secrets.CRATER_GITHUB_TOKEN }}
          CORE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: crater publish -y

      - name: Merge the registry pull request
        if: steps.registry.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ secrets.CRATER_GITHUB_TOKEN }}
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          PR: ${{ steps.registry.outputs.pr }}
        run: |
          pr="$PR"
          for attempt in $(seq 1 12); do
            [ -n "$pr" ] && break
            sleep 5
            pr=$(gh pr list -R "$REGISTRY" --state open --search "Publish $NAME@$VERSION in:title" --json number --jq '.[0].number // empty')
          done

          if [ -z "$pr" ]; then
            echo "::error::cannot find the registry pull request for $NAME@$VERSION"
            exit 1
          fi

          if [ "$(gh api "repos/$REGISTRY" --jq .permissions.maintain)" != "true" ]; then
            echo "::notice::$REGISTRY#$pr is opened, the registry owner has to merge it"
            exit 0
          fi

          sleep 20
          gh pr checks "$pr" -R "$REGISTRY" --watch --fail-fast

          if gh pr merge "$pr" -R "$REGISTRY" --squash; then
            echo "$NAME@$VERSION is merged into $REGISTRY"
          else
            echo "::notice::$REGISTRY#$pr passed the checks but the registry rules block the merge, merge it by hand: https://github.com/$REGISTRY/pull/$pr"
          fi
